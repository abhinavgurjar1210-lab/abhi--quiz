let current = 0;
let score = 0;

function loadQuestion() {

    document.getElementById("question").innerText =
        questions[current].q;

    document.getElementById("number").innerText =
        "Question " + (current + 1) + " / " + questions.length;

    for (let i = 0; i < 4; i++) {

        let btn = document.getElementById("a" + i);

        btn.innerText = questions[current].a[i];

        btn.style.display = "block";
        btn.disabled = false;
    }

    document.getElementById("score").innerText =
        "Score: " + score;
}

function answer(choice) {

    let buttons = document.querySelectorAll("button");

    if (choice === questions[current].correct) {
        score++;
        alert("✅ सही जवाब!");
    } else {
        alert("❌ गलत जवाब!");
    }

    current++;

    if (current < questions.length) {

        loadQuestion();

    } else {

        document.getElementById("question").innerText =
            "🎉 Quiz Complete!";

        document.getElementById("number").innerText =
            "50 Questions Complete";

        document.getElementById("score").innerText =
            "🏆 आपका Score: " + score + "/" + questions.length;

        for (let i = 0; i < 4; i++) {
            document.getElementById("a" + i).style.display = "none";
        }

        let restart = document.createElement("button");

        restart.innerText = "🔄 Restart Quiz";
        restart.id = "restart";
        restart.onclick = function() {
            current = 0;
            score = 0;

            for (let i = 0; i < 4; i++) {
                document.getElementById("a" + i).style.display = "block";
            }

            restart.remove();

            loadQuestion();
        };

        document.querySelector(".quiz").appendChild(restart);
    }
}
